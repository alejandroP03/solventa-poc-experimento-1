[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solventa-common"
version = "0.1.0"
description = "Librería transversal del POC Solventa (Experimento 1, MISW4202)"
requires-python = ">=3.11"

# Sin dependencias innecesarias (§13.8): solo lo que la librería usa de verdad.
# Las versiones se fijan para que dos corridas del experimento separadas en el
# tiempo se ejecuten sobre el mismo código.
dependencies = [
    "flask==3.0.3",
    "gunicorn==22.0.0",
    "prometheus-client==0.20.0",
    "pika==1.3.2",
    "requests==2.32.3",
]

[project.optional-dependencies]
test = ["pytest==8.2.2"]

[tool.setuptools.packages.find]
include = ["solventa_common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
