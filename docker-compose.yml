# Stack del POC Solventa — modo treatment por defecto.
#
#   make up          levanta todo
#   make baseline    aplica el override del control de SP-0
#
# Cada servicio lee su configuración de .env (`make env` lo crea desde
# .env.example) más los overrides explícitos de `environment:`, que son los que
# el experimento necesita fijar por instancia.

name: solventa

x-service-defaults: &service-defaults
  env_file: .env
  restart: unless-stopped
  # Sin dependencias de orden de arranque (§8.2): cada servicio arranca aunque
  # sus dependencias no estén listas y reintenta con backoff. `depends_on` sin
  # condición solo ordena el arranque, no lo bloquea — ECS tampoco lo garantiza.

services:

  # --- Punto de entrada del socio ------------------------------------------ #

  kong:
    image: kong:3.7
    container_name: solventa-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      # Admin API apagada: el experimento no reconfigura Kong en caliente, y una
      # API de administración abierta sería una vía para alterar el instrumento
      # a mitad de corrida sin dejar rastro.
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: /dev/null   # las peticiones ya se cuentan en /metrics
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: notice
      KONG_NGINX_WORKER_PROCESSES: "2"
    volumes:
      - ./infra/kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8080:8000"    # el socio entra por 8080, como fija §2.1
      - "8100:8100"    # /metrics y /status para Prometheus
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Journey de cotización ------------------------------------------------ #

  socio-distribucion:
    <<: *service-defaults
    container_name: solventa-socio-distribucion
    build:
      context: .
      dockerfile: services/socio-distribucion/Dockerfile
    image: solventa/socio-distribucion:local
    environment:
      SERVICE_NAME: socio-distribucion
      PORT: 8081
    ports:
      - "8081:8081"

  cotizacion:
    <<: *service-defaults
    container_name: solventa-cotizacion
    build:
      context: .
      dockerfile: services/cotizacion/Dockerfile
    image: solventa/cotizacion:local
    environment:
      SERVICE_NAME: cotizacion
      PORT: 8082
    ports:
      - "8082:8082"

  financial-profiler:
    <<: *service-defaults
    container_name: solventa-financial-profiler
    build:
      context: .
      dockerfile: services/financial-profiler/Dockerfile
    image: solventa/financial-profiler:local
    environment:
      SERVICE_NAME: financial-profiler
      PORT: 8085
    ports:
      - "8085:8085"

  # Dos instancias del mismo código, distinto ROLE. RabbitMQ entrega a una sola
  # (single active consumer) y promueve a la otra cuando la activa se desconecta:
  # es la táctica de takeover del modelo de despliegue, implementada de forma
  # nativa por el broker y sin coordinador propio.
  procesador-cotizacion-primary:
    <<: *service-defaults
    container_name: solventa-procesador-primary
    build:
      context: .
      dockerfile: services/procesador-cotizacion/Dockerfile
    image: solventa/procesador-cotizacion:local
    environment:
      SERVICE_NAME: procesador-cotizacion
      PORT: 8083
      ROLE: PRIMARY
    ports:
      - "8083:8083"

  procesador-cotizacion-backup:
    <<: *service-defaults
    container_name: solventa-procesador-backup
    # Misma imagen que el primary: se construye una vez y se despliega dos.
    image: solventa/procesador-cotizacion:local
    environment:
      SERVICE_NAME: procesador-cotizacion
      PORT: 8084
      ROLE: BACKUP
    ports:
      - "8084:8084"
    depends_on:
      - procesador-cotizacion-primary

  # --- Detección proactiva -------------------------------------------------- #

  monitor:
    <<: *service-defaults
    container_name: solventa-monitor
    build:
      context: .
      dockerfile: services/monitor/Dockerfile
    image: solventa/monitor:local
    environment:
      SERVICE_NAME: monitor
      PORT: 8086
    ports:
      - "8086:8086"

  # --- Caché ---------------------------------------------------------------- #

  redis:
    image: redis:7.2-alpine
    container_name: solventa-redis
    restart: unless-stopped
    # Exclusivamente caché de perfil, NUNCA broker (§1): compartir la instancia
    # entre caché y mensajería crearía un dominio de fallo común que confundiría
    # la medición de SP-5, cuyo objeto es precisamente el aislamiento.
    #
    # Sin persistencia: el estado de la caché es parte del fixture de cada
    # corrida y lo fija seed_data.py según CACHE_PRELOAD_RATIO. Que sobreviviera
    # a un reinicio haría que una corrida heredara la caché de la anterior y el
    # escenario de caché fría sería irreproducible.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Broker --------------------------------------------------------------- #

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: solventa-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: solventa
      RABBITMQ_DEFAULT_PASS: solventa
      # Carga la topología estable al arrancar. Los servicios la redeclaran de
      # forma idempotente, porque §8.2 no admite dependencias de orden.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # consola de management
      - "15692:15692"   # exporter nativo de Prometheus
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # --- Instrumento del experimento ------------------------------------------ #

  mock-openfinance:
    <<: *service-defaults
    container_name: solventa-mock-openfinance
    build:
      context: .
      dockerfile: services/mock-openfinance/Dockerfile
    image: solventa/mock-openfinance:local
    environment:
      SERVICE_NAME: mock-openfinance
      PORT: 8090
    ports:
      - "8090:8090"
