# RabbitMQ 3.13 — configuración del broker del experimento (kickoff §1, §3.2).

default_user = solventa
default_pass = solventa
default_vhost = /

# Puertos de §1: 5672 AMQP, 15672 management, 15692 Prometheus.
listeners.tcp.default = 5672
management.tcp.port = 15672
prometheus.tcp.port = 15692

# El exporter nativo agrega por cola. Sin esto, `rabbitmq_queue_messages` vendría
# sumado por vhost y la profundidad de `cotizacion.requests` —métrica de decisión
# de SP-5— no sería observable por separado.
prometheus.return_per_object_metrics = true

# Umbrales de memoria y disco holgados: el experimento corre 240 s a 50 rps sobre
# una instancia con 8 GB. Que el broker entre en flow control por presión de
# memoria introduciría una causa de latencia que el modelo de §3 no contempla y
# que se confundiría con el sobrecosto del broker que mide §7.1.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Los logs van a stdout para que el driver de Docker los recoja como el resto
# de servicios (§8.2), nunca a archivo.
log.console = true
log.console.level = warning
log.file = false
